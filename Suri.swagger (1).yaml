  /api/shop/products/batch/{bach_id}:
    get:
      summary: Buscar batch request
      deprecated: false
      description: >-
        ## API Request Description


        This endpoint retrieves the results of a batch request for products
        based on the provided `batch_id`. It returns a response indicating the
        success of the request along with detailed information about each
        product request made in the batch.


        The response will include the following fields:


        - `success`: A boolean indicating whether the batch request was
        successful.
            
        - `data`: An object containing:
            
            - `id`: The identifier for the batch request.
                
            - `requests`: An array of objects, each representing an individual product request with the following fields:
                
                - `productId`: The unique identifier of the product.
                    
                - `status`: The current status of the request (e.g., processed, pending).
                    
                - `updatedAt`: A timestamp indicating when the request was last updated.
                    
                - `errorMessage`: Any error message associated with the request, if applicable.
                    
            - `isCompleted`: A boolean indicating whether all requests in the batch have been completed.
                
            - `finishedAt`: A timestamp indicating when the batch processing finished.
                

        In case of an error, the response will also include:


        - `error`: A message detailing the error, if any occurred during
        processing.
            
        - `errorCode`: A code representing the type of error encountered.
            

        ### Example Response


        ``` json

        {
          "success": true,
          "data": {
            "id": "",
            "requests": [
              {
                "productId": "",
                "status": "",
                "updatedAt": 0,
                "errorMessage": null
              }
            ],
            "isCompleted": true,
            "finishedAt": 0
          },
          "error": null,
          "errorCode": null
        }

         ```

        ### Important Notes


        - Ensure that the `batch_id` provided corresponds to a valid batch
        request.
            
        - The endpoint will return a 200 status code if the request is
        successful.
            

        ### JSON Object Structure


        #### Main Fields


        | Field | Type | Required | Description |

        | --- | --- | --- | --- |

        | `id` | `string` | Yes | Unique identifier for the product. |

        | `requests` | `Request[]` | Yes | List of requests for products in the
        batch. |

        | `isCompleted` | `boolean` | Yes | Indicates if all requests have been
        completed. |

        | `finishedAt` | `number` | Yes | Timestamp when the batch processing
        finished. |


