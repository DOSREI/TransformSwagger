                            boleto:
                              type: object
                              properties:
                                digitableLine:
                                  type: string
                              required:
                                - digitableLine
                          required:
                            - type
                      totalAmount:
                        type: number
                      order:
                        type: object
                        properties:
                          status:
                            type: string
                          tax:
                            type: object
                            properties:
                              value:
                                type: number
                              description:
                                type: string
                            required:
                              - value
                              - description
                          items:
                            type: array
                            items:
                              type: object
                              properties:
                                retailerId:
                                  type: string
                                name:
                                  type: string
                                amount:
                                  type: integer
                                quantity:
