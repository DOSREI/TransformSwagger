  /api/shop/products:
    post:
      summary: Criar Produto
      deprecated: false
      description: >-
        Os produtos possuem a propriedade Dimensions, é importante que
        Dimensions estejam de acordo com Attributes, nela poderão ser definidas
        os SKUs referentes ao produto, estoques e preços por loja.


        O item será salvo do lado da SURI com o mesmo id passado.


        **OBS.:** Para criar um produto, é necessário que a categoria a qual
        esse produto fará parte já esteja criada, caso o contrário, não será
        possível a criação do produto.


        Estrutura do Objeto JSON


        ## Estrutura do Objeto JSON


        ### Campos Principais


        | Campo | Tipo | Obrigatório | Descrição |

        | --- | --- | --- | --- |

        | `id` | `string` | Sim | Identificador único do produto. |

        | `sku` | `string` | Sim | Código de referência do produto. |

        | `categoryId` | `string` | Sim | Identificador da categoria pai do
        produto. |

        | `subcategoryId` | `string` | Não | Identificador da subcategoria do
        produto. |

        | `brand` | `ShopBrand/null` | Não | Informações da marca do produto. |

        | `sellerId` | `string` | Não | Identificador do vendedor. |

        | `sellerName` | `string/null` | Não | Nome do vendedor. |

        | `isActive` | `boolean` | Sim | Indica se o produto está ativo. |

        | `name` | `string` | Sim | Nome do produto. |

        | `description` | `string` | Não | Descrição do produto. |

        | `url` | `string/null` | Não | URL do produto. |

        | `hasShippingRestriction` | `boolean` | Não | Indica se há restrições
        de envio. |

        | `images` | `Image[]` | Sim | Lista de imagens do produto. |

        | `attributes` | `Attribute[]` | Não | Lista de atributos do produto. |

        | `dimensions` | `Dimension[]` | Não | Lista de dimensões e variações do
        produto. |

        | `weightInGrams` | `number` | Não | Peso do produto em gramas. |


        ---


        ### Estrutura de `ShopBrand`


        | Campo | Tipo | Obrigatório | Descrição |

        | --- | --- | --- | --- |

        | `providerId` | `string` | Sim | Identificador no provedor. |

        | `name` | `string` | Sim | Nome da marca. |

        | `description` | `string` | Não | Descrição da marca. |


        ---


        ### Estrutura de `Image`


        | Campo | Tipo | Obrigatório | Descrição |

        | --- | --- | --- | --- |

        | `providerId` | `string/null` | Não | Identificador do provedor da
        imagem. |

        | `url` | `string` | Sim | URL da imagem. |

        | `description` | `string/null` | Não | Descrição da imagem. |


        ---


        ### Estrutura de `Attribute`


        | Campo | Tipo | Obrigatório | Descrição |

        | --- | --- | --- | --- |

        | `name` | `string` | Sim | Nome do atributo (exemplo: Cor, Tamanho). |

        | `options` | `Option[]` | Sim | Lista de opções para o atributo. |


        #### Estrutura de `Option`


        | Campo | Tipo | Obrigatório | Descrição |

        | --- | --- | --- | --- |

        | `name` | `string` | Sim | Nome da opção (exemplo: Vermelho, Azul, P,
        M, G). |


        ---


        ### Estrutura de `Dimension`


        | Campo | Tipo | Obrigatório | Descrição |

        | --- | --- | --- | --- |

        | `sku` | `string` | Sim | SKU da variação do produto. |

        | measurements | `object` | não | medidas fisicas do produto. |

        | `dimensions` | `object` | Sim | Mapeamento dos atributos da variação.
        |

        | `image` | `Image` | Não | Imagem específica da variação. |

        | `price` | `number` | Sim | Preço da variação. |

        | `stocks` | `StockMap` | Sim | Estoque por localização.  <br>Ex. 
        <br>"stocks": {  <br>"48346": {  <br>"stock":0  <br>}  <br>} |


        #### Estrutura de `StockMap`


        | Chave (ID da loja) | Tipo | Obrigatório | Descrição |

        | --- | --- | --- | --- |

        | `stock` | `number` | Sim | Quantidade disponível no estoque. |


