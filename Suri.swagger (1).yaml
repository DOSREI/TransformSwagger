    post:
      summary: Criar Template com Arquivo
      deprecated: false
      description: >-
        Cria template com arquivo no cabeçalho


        Este endpoint é o mesmo utilizado para os demais de criação de template.
        Dividimos somente para fins didáticos, pois a única mudança são em
        alguns atributos enviados no BODY.


        O Body deste endpoint é composto por


        - **template**: Objeto representando a template a ser criada, que tem
        como campos:
            

        | **Nome** | **Tipo** | **Obrigatório?** | **Descrição** |

        | --- | --- | --- | --- |

        | title | string | Sim | Título da template |

        | body | string | Sim | Texto do corpo da template. **Tem limite máximo
        de 1024 caracteres** |

        | subject | string | Não | Assunto da template, serve como categoria
        interna para filtrar na tela do Portal. **Importante: o Assunto deve ter
        sido previamente criado no portal** |

        | channelId | string | Sim | Id do canal em que a template será criada e
        vinculada no WhatsApp. **Só são aceitos canais WhatsApp**. |

        | category | string | Sim | Categoria da template. **Valores possíveis:
        MARKETING, UTILITY** |

        | headerType | int | Sim | Tipo de arquivo enviado no cabeçalho. **Os
        valores permitidos são 0 para imagem, 1 para Vídeo e 2 para PDF** |


        - **templateExample**: String representando um exemplo de corpo da
        template. Se não possuir variáveis, **deve ser sempre igual ao
        template.body**.
            
        - **bodyExamples**: Array de exemplos de variável. Se não possuir
        variáveis, **deve-se enviar array vazio** \[\].
            
        - **sampleFile**: Arquivo padrão da template, isto é, ao enviar pelo
        Portal, ele será listado e o atendente pode apenas selecioná-lo ao invés
        de enviar um novo arquivo (segue imagem abaixo). É um objeto que tem a
        seguinte estrutura:
            

        <img
        src="https://content.pstmn.io/78bd0d20-740e-4341-93f3-16c30379cbe2/aW1hZ2UucG5n"
        width="273" height="253">


        | **Nome** | **Tipo** | **Obrigatório?** | **Descrição** |

        | --- | --- | --- | --- |

        | fileName | string | Sim | Nome do arquivo com extensão no final.
        Exemplo: "logo.png" |

        | url | string | Não \* | URL do arquivo a ser inserido como padrão |

        | base64File | string | Não \* | Base64 do arquivo a ser inserido como
        padrão |


        \*Um dos atributos **url** ou **base64File** devem ser enviados. Se
        ambos forem passados, a prioridade é utilizar **url**.


        O retorno deste endpoint é:


        | **Propriedade** | **Tipo** | **Descrição** |

        | --- | --- | --- |

        | success | bool | Se a requisição deu certo ou não |

        | data | Template | Template em questão. Veja a definição na página de
        [Modelos](https://documenter.getpostman.com/view/17684221/UUxz9mt5#ed8a2f4b-ca08-4212-9e7a-153f108d9bf7).
        |

        | error | string / null | O texto do erro caso haja algum erro |
      tags:
        - APIs/Templates
      parameters:
        - name: body
          in: body
          schema:
            type: object
            properties:
              template:
                type: object
                properties:
                  title:
                    type: string
                  body:
                    type: string
                  subject:
                    type: string
                  channelId:
                    type: string
                  category:
                    type: string
                  headerType:
                    type: integer
                required:
                  - title
                  - body
                  - subject
                  - channelId
                  - category
                  - headerType
              templateExample:
                type: string
              bodyExamples:
                type: array
                items: {}
              sampleFile:
                type: object
                properties:
                  url:
                    type: string
                  fileName:
                    type: string
                required:
                  - url
                  - fileName
            required:
              - template
              - templateExample
              - bodyExamples
              - sampleFile
      responses:
        '200':
          description: ''
          headers: {}
          examples:
            application/json:
              success: true
              data:
                $type: >-
                  ChatbotMaker.BDK.Models.WhatsAppTemplateMessage,
                  ChatbotMaker.BDK
                isWhatsappTemplate: true
                channelName: WhatsApp Numero Teste
                channelId: wp350628444809181
                channelProvider: 7
                messageId: '676451034861611'
                messageName: iniciando_contato_teste_com_cabecalho_2
