                    type: string
                  channelProvider:
                    type: integer
                  messageId:
                    type: string
                  messageName:
                    type: string
                  rejectedReason:
                    type: 'null'
                  footer:
                    type: 'null'
                  headerType:
                    type: integer
                  limitedTimeOffer:
                    type: 'null'
                  subType:
                    type: integer
                  category:
                    type: string
                  templateType:
                    type: 'null'
                  attachmentsFiles:
                    type: array
                    items:
                      type: object
                      properties:
                        url:
                          type: string
                        fileName:
                          type: string
                  variableExamples:
                    type: array
                    items: {}
                  buttons:
                    type: array
                    items: {}
                  status:
                    type: integer
