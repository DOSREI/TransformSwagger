info:
  title: Suri
  description: >-
    Por aqui vamos te ajudar a usar todas as funcionalidades da nossa plataforma
    da melhor forma possível para encantar seus clientes.


    Esta documentação contém todos os Endpoints existentes na API, definições e
    informações sobre Webhooks. Para dicas sobre como integrar a Suri em seu
    fluxo de conversação, veja nosso [Manual de
    Integração](https://sejasuri.gitbook.io/manual-de-integracao).
  version: 1.0.0
tags:
  - name: APIs
  - name: APIs/Departamentos
  - name: APIs/Atendentes
  - name: APIs/Canais
  - name: APIs/Contatos
  - name: APIs/Mensagens
  - name: APIs/Integrations
  - name: APIs/Templates
  - name: APIs/Campanhas
  - name: APIs/Shop
  - name: APIs/Shop/Categories
  - name: APIs/Shop/Stores
  - name: APIs/Shop/Product
  - name: APIs/Shop/Webhook
  - name: APIs/Shop/Orders
  - name: APIs/Shop/Coleções
  - name: APIs/Atendimentos
paths:
  /api/departments:
    get:
      summary: Listar Departamentos
      deprecated: false
      description: >-
        Retorna todos os Departamentos do chatbot


        | **Propriedade** | **Tipo** | **Descrição** |

        | --- | --- | --- |

        | success | bool | Se a requisição deu certo ou não |

        | data |
        [Department](https://documenter.getpostman.com/view/17684221/UUxz9mt5#ed8a2f4b-ca08-4212-9e7a-153f108d9bf7)\[
        \] | Lista de Departamentos do chatbot |

        | error | string | null |
      tags:
        - APIs/Departamentos
      parameters: []
      responses:
        '200':
          description: ''
          headers: {}
          examples:
            application/json:
              success: true
              data:
                - id: cb9996
                  Name: teste
                - id: cb9997
                  Name: teste2
                - id: cb9998
                  Name: teste 3
                - id: cb9999
                  Name: teste 3
              error: null
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    Name:
                      type: string
                  required:
                    - id
                    - Name
              error:
                type: 'null'
            required:
              - success
              - data
              - error
        '400':
          description: ''
          headers: {}
          examples:
            application/json:
              success: false
              data: null
              error: No Departments Found
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: 'null'
              error:
                type: string
            required:
              - success
              - data
              - error
      security:
        - bearer: []
      produces:
        - application/json
  /api/attendants:
    get:
      summary: Listar Atendentes
      deprecated: false
      description: >-
        Retorna todos os Atendentes do chatbot


        | **Propriedade** | **Tipo** | **Descrição** |

        | --- | --- | --- |

        | success | bool | Se a requisição deu certo ou não |

        | data |
        [Attendant](https://documenter.getpostman.com/view/17684221/UUxz9mt5#ed8a2f4b-ca08-4212-9e7a-153f108d9bf7)\[
        \] | Lista de Atendentes do bot |

        | error | string / null | O texto do erro caso haja algum erro |
      tags:
        - APIs/Atendentes
      parameters: []
      responses:
        '200':
          description: ''
          headers: {}
          examples:
            application/json:
              success: true
              data:
                - id: cb1157
                  name: Nome Teste
                  email: teste@chatbotmaker.io
              error: null
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    email:
                      type: string
              error:
                type: 'null'
            required:
              - success
              - data
              - error
        '400':
          description: ''
          headers: {}
          examples:
            application/json:
              success: false
              data: null
              error: No Attendants Found
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: 'null'
              error:
                type: string
            required:
              - success
              - data
              - error
      security:
        - bearer: []
      produces:
        - application/json
  /api/channels:
    get:
      summary: Listar Canais
      deprecated: false
      description: >-
        Retorna todos os canais do bot


        | **Propriedade** | **Tipo** | **Descrição** |

        | --- | --- | --- |

        | success | bool | Se a requisição deu certo ou não |

        | data |
        [Channel](https://documenter.getpostman.com/view/17684221/UUxz9mt5#ed8a2f4b-ca08-4212-9e7a-153f108d9bf7)\[
        \] | Lista de Canais do bot |

        | error | string / null | O texto do erro caso haja algum erro |
      tags:
        - APIs/Canais
      parameters: []
      responses:
        '200':
          description: ''
          headers: {}
          examples:
            application/json:
              success: true
              data:
                - name: Webchat
                  provider: 0
                  type: 2
                  id: wc1797
                - name: CBM Homologação 4
                  provider: 0
                  type: 0
                  id: fb105433221098525
              error: null
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    provider:
                      type: integer
                    type:
                      type: integer
                    id:
                      type: string
                  required:
                    - name
                    - provider
                    - type
                    - id
              error:
                type: 'null'
            required:
              - success
              - data
              - error
      security:
        - bearer: []
      produces:
        - application/json
  /api/contacts:
    post:
      summary: Importar contato
      deprecated: false
      description: >-
        Esse endpoint pode ser usado para adicionar um novo contato ao seu
        chatbot


        | Propriedade | Tipo | Descrição |

        | --- | --- | --- |

        | name | string | Nome do contato |

        | phone | string | Número do contato que você deseja importar (com 55,
        DDD e o digito 9) |

        | email | string | Email do contato |

        | gender | int | Gênero do contato (0 para masculino, 1 para feminino e
        2 para indefinido) |

        | channelId | string | O Id do canal ao qual você deseja importar o
        usuário. O ID do canal WhatsApp pode ser encontrado na página
        Configurações > aba Canais > escolhendo o Canal WhatsApp. |

        | channelType | int | Tipo de canal ao qual o usuário será importado.
        OBS: Atualmente é apenas suportado o tipo 1 (WhatsApp) |

        | note | string | Observações do contato (opcional) |

        | variables | object | Opcional. Variáveis para adicionar ao contato. É
        um objeto chave-valor de string-string, ou seja, só aceita objetos cuja
        chave e valor sejam string. |
      tags:
        - APIs/Contatos
      parameters:
        - name: body
          in: body
          schema:
            type: object
            properties:
              name:
                type: string
              phone:
                type: string
              gender:
                type: integer
              channelId:
                type: string
              channelType:
                type: integer
            required:
              - name
              - phone
              - gender
              - channelId
              - channelType
      responses:
        '200':
          description: ''
          headers: {}
          examples:
            application/json:
              success: true
              data: wpcb12345teste:5599988887777
              error: null
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: string
              error:
                type: 'null'
            required:
              - success
              - data
              - error
      security:
        - bearer: []
      consumes:
        - application/json
      produces:
        - application/json
    get:
      summary: Listar Contatos
      deprecated: false
      description: >-
        \[DEPRECATED - Utilizar o endpoint
        [https://documenter.getpostman.com/view/17684221/UUxz9mt5#36567385-3347-4752-8e85-ad870a1d9624](https://documenter.getpostman.com/view/17684221/UUxz9mt5#36567385-3347-4752-8e85-ad870a1d9624)\]


        Uma requisição a essa rota pode ser com ou sem `continuationToken`. Se o
        `continuationToken` não estiver definido, será retornada a primeira
        página daquela requisição.


        O `limit` representa o tamanho da página à ser retornada. É importante
        falar que para um conjunto de páginas, o limit deve ser constante.


        A página retornada terá o seguinte formato


        ``` json

        {
            "Items":{...},
            "ContinuationToken":""
        }

         ```

        | **Propriedade** | **Tipo** | **Descrição** |

        | --- | --- | --- |

        | Items | array | Lista de
        [User](https://documenter.getpostman.com/view/17684221/UUxz9mt5#ed8a2f4b-ca08-4212-9e7a-153f108d9bf7)
        |

        | ContinuationToken | string | Token de paginação |
      tags:
        - APIs/Contatos
      parameters:
        - name: continuationToken
          in: query
          description: ''
          required: true
          type: string
          x-example: ''
        - name: limit
          in: query
          description: ''
          required: true
          type: string
          x-example: ''
      responses:
        '200':
          description: ''
          headers: {}
          examples:
            application/json:
              success: true
              data:
                Items:
                  data:
                    id: wc1797:1819
                    name: null
                    chatbotId: cb1797
                    channelId: wc1797
                    channelType: 2
                    phone: null
                    email: null
                    profilePicture:
                      name: cb1797/wc1797/aa93b4d9edad41c29fa08d964995bec3.jpg
                      url: >-
                        https://cbmstgstaging.blob.core.windows.net/content/cb1797/wc1797/aa93b4d9edad41c29fa08d964995bec3.jpg
                    gender: 2
                    identificationDocument: null
                    note: null
                    dateCreate: '2021-08-16T16:13:16.5847339Z'
                    lastActivity: '2021-08-16T16:28:39.9519987Z'
                    tags: null
                    currentDialog:
                      uri:
                        path: cbm://babysuri/dialogs/basic/waitingdialog/
                        query: ''
                        parameters: {}
                      data: {}
                ContinuationToken: TOKENDEEXEMPLO
              error: null
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  Items:
                    type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: string
                          name:
                            type: 'null'
                          chatbotId:
                            type: string
                          channelId:
                            type: string
                          channelType:
                            type: integer
                          phone:
                            type: 'null'
                          email:
                            type: 'null'
                          profilePicture:
                            type: object
                            properties:
                              name:
                                type: string
                              url:
                                type: string
                            required:
                              - name
                              - url
                          gender:
                            type: integer
                          identificationDocument:
                            type: 'null'
                          note:
                            type: 'null'
                          dateCreate:
                            type: string
                          lastActivity:
                            type: string
                          tags:
                            type: 'null'
                          currentDialog:
                            type: object
                            properties:
                              uri:
                                type: object
                                properties:
                                  path:
                                    type: string
                                  query:
                                    type: string
                                  parameters:
                                    type: object
                                    properties: {}
                                required:
                                  - path
                                  - query
                                  - parameters
                              data:
                                type: object
                                properties: {}
                            required:
                              - uri
                              - data
                        required:
                          - id
                          - name
                          - chatbotId
                          - channelId
                          - channelType
                          - phone
                          - email
                          - profilePicture
                          - gender
                          - identificationDocument
                          - note
                          - dateCreate
                          - lastActivity
                          - tags
                          - currentDialog
                    required:
                      - data
                  ContinuationToken:
                    type: string
                required:
                  - Items
                  - ContinuationToken
              error:
                type: 'null'
            required:
              - success
              - data
              - error
      security:
        - bearer: []
      produces:
        - application/json
  /api/contacts/batch:
    post:
      summary: Importar contatos batch
      deprecated: false
      description: >-
        Esse endpoint pode ser usado para adicionar múltiplos contatos ao seu
        chatbot. O body a ser enviado deve ser um array de objetos que contém os
        seguintes atributos.


        | Propriedade | Tipo | Descrição |

        | --- | --- | --- |

        | name | string | Nome do contato |

        | phone | string | Número do contato que você deseja importar (com 55,
        DDD e o digito 9) |

        | email | string | Email do contato |

        | gender | int | Gênero do contato (0 para masculino, 1 para feminino e
        2 para indefinido) |

        | channelId | string | O Id do canal ao qual você deseja importar o
        usuário. O ID do canal WhatsApp pode ser encontrado na página
        Configurações > aba Canais > escolhendo o Canal WhatsApp. |

        | channelType | int | Tipo de canal ao qual o usuário será importado.
        OBS: Atualmente é apenas suportado o tipo 1 (whatsapp) |

        | note | string | Observações do contato (opcional) |

        | variables | object | Opcional. Variáveis para adicionar ao contato. É
        um objeto chave-valor de string-string, ou seja, só aceita objetos cuja
        chave e valor sejam string. |
      tags:
        - APIs/Contatos
      parameters:
        - name: body
          in: body
          schema:
            type: array
            items:
              type: object
              properties:
                name:
                  type: string
                phone:
                  type: string
                email:
                  type: string
                  x-nullable: true
                gender:
                  type: integer
                channelId:
                  type: string
                channelType:
                  type: integer
                note:
                  type: string
                variables:
                  type: object
                  properties:
                    var1:
                      type: string
                  required:
                    - var1
              required:
                - name
                - phone
                - email
                - gender
                - channelId
                - channelType
      responses:
        '200':
          description: ''
          headers: {}
          examples:
            application/json:
              success: true
              data: wpcb12345teste:5599988887777
              error: null
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: string
              error:
                type: 'null'
            required:
              - success
              - data
              - error
      security:
        - bearer: []
      consumes:
        - application/json
      produces:
        - application/json
