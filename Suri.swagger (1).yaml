  /api/messages/send:
    post:
      summary: Mensagem de template de pagamento
      deprecated: false
      description: >-
        Envia mensagem template de pagamento.


        Mensagens de pagamento do WhatsApp utilizam **Payments API**, que
        permitem enviar templates estruturadas com botões de link de pagamento
        de cartão e/ou PIX Copia e Cola e/ou boleto. Mensagens de pagamento
        tendem a ser mais performáticas e converter mais as cobranças enviadas
        devido à praticidade oferecida pelo botão de copiar PIX e linha
        digitável de boleto e a simplicidade do acesso ao link de pagamento .


        <img
        src="https://content.pstmn.io/cb209415-b59c-4d46-9de8-688cda20eb6c/aW1hZ2UucG5n"
        width="357" height="346">


        O envio segue o mesmo padrão das demais templates, onde você pode passar
        o atributo **user** caso queira importar/atualizar um contato ao mesmo
        tempo que envia a mensagem ou então o atributo **userId** se deseje
        apenas utilizar um contato que já existe em sua base. O mesmo vale para
        o atributo message. A única diferença está de fato em um novo atributo
        enviado dentro de message: **OrderParameters**). Seguem exemplos:


        Envio de template com import de contato:


        ``` javascript

        {
           "user": {
                "name": "<Nome do contato>",
                "phone": "<Telefone do contato com DDI e DDD>",
                "email": null,
                "gender": 0,
                "channelId": "<Id do canal>",
                "channelType": 1,
                "defaultDepartmentId": null
           },
           "message": {
              // ...
           }
           // ...
        }

         ```

        Envio de template sem o import de contato:


        ``` javascript

        {
           "userId": "<ID do contato>",
           "message": {
              // ...
           }
           // ...
        }

         ```

        O objeto message está definido da seguinte forma:


        | **Propriedade** | **Tipo** | **Obrigatório?** | **Descrição** |

        | --- | --- | --- | --- |

        | templateId | string | Sim | ID da template do WhatsApp. Este ID pode
        ser encontrado clicando na template no Portal, é o campo Identificador.
        |

        | mediaTemplateType | string | Sim, se template foi criada com cabeçalho
        de mídia | Tipo do arquivo, no caso de template de pagamento, deve ser
        "image" pois é o único tipo de cabeçalho aceito |

        | link | string | Sim, se template foi criada com cabeçalho de mídia |
        Link do arquivo |

        | bodyParameters | string\[\] | Sim, se template tiver parâmetros
        (variáveis) no corpo da mensagem | Lista de parâmetros do corpo da
        template. Se não houver nenhum parâmetro, passar array vazio \[\] |

        | orderParameters | OrderDetails | Sim | Objeto contendo os dados do
        pedido |

        | responseAction | ResponseAction | Não | Objeto que define a ação a ser
        executada caso o contato responda à mensagem template |


        O objeto orderParameters está definido da seguinte maneira:


        | **Propriedade** | **Tipo** | **Obrigatório?** | **Descrição** |

        | --- | --- | --- | --- |

        | referenceId | string | Sim | Identificador único do pedido, importante
        para poder correlacionar eventos de pagamento com a mensagem de
        pagamento enviada. Todas as atualizações de status serão marcadas como
        uma resposta à mensagem através do referenceId. Exemplo: 123s4f5-01 |

        | paymentSettings | PaymentSettings\[\] | Sim | Opções disponíveis para
        pagamento. É o que define quais botões serãoenviados na template. Pode
        ter até dois itens no array: um do tipo PIX e outro do tipo Link de
        pagamento (ambos estão descritos mais abaixo) |

        | totalAmount | decimal | Sim | Representa o total da compra, incluindo
        taxas,. É o valor que será mostrado ao contato na mensagem. ATENÇÃO: o
        valor deve ser igual ao valor da taxa (se houver) + somatório do valor
        dos itens, caso contrário, um erro é retornado. Exemplo: 25.99 |

        | order | Order | Sim | Detalhamento do pedido, contendo informações dos
        itens, quantidades e taxa. Ver descrição completa mais abaixo. |


        O array paymentSettings pode ter NO MÁXIMO 2 itens e ter NO MÌNIMO 1
        item, não podendo repetir 2 itens iguais (por exemplo, dois PIX ou dois
        Links de pagamento juntos). Ou seja, só é possível ter uma das seguintes
        combinações de cobrança:


        - PIX + Link
            
        - PIX + Boleto
            
        - Llink + Boleto
            
        - Somente PIX, somente Boleto ou somente Link
            

        Seguem abaixo as definições dos tipos de pagamento disponíveis:


        **Copiar Chave PIX:**


        | **Propriedade** | **Tipo** | **Obrigatório?** | **Descrição** |

        | --- | --- | --- | --- |

        | type | string | Sim | Deve ser "pix_dynamic_code" |

        | pixDynamicCode | PixDynamicCode | Sim | Objeto contendo as informações
        da chave PIX em questão. ver detalhamento mais abaixo |


        PixDynamicCode:


        | **Propriedade** | **Tipo** | **Obrigatório?** | **Descrição** |

        | --- | --- | --- | --- |

        | code | string | Sim | A chave Pix Copia-E-Cola que será copiada pelo
        contato ao clicar no botão da template |

        | merchantName | string | Sim | Nome da empresa/pessoa que é dona da
        chave PIX em questão. Tem propósito puramente informacional, pois o nome
        é informado na tela para deixar o destino do PIX mais claro para o
        comprador |

        | key | string | Sim | A chave PIX que será mostrada ao contato na
        mensagem,tem propósito puramente informacional, geralmente se trata do
        CPF ou CNPJ do recebedor do PIX (sem pontos ou traços) |

        | keyType | string | Sim | Tipo da chave informada no atributo key. Os
        valores possíveis são: CPF, CNPJ, EMAIL, PHONE ou EVP (chave aleeatória)
        |


        **Link de Pagamento:**


        | Propriedade | **Tipo** | **Obrigatório?** | Descrição |

        | --- | --- | --- | --- |

        | type | string | Sim | Deve ser "payment_link" |

        | paymentLink | PaymentLink | Sim | Objeto que contém a url do link de
        pagamento dentro de um atributo chamado "uri" |


        PaymentLink:


        | **Propriedade** | **Tipo** | **Obrigatório** | **Descrição** |

        | --- | --- | --- | --- |

        | uri | string | Sim | URL do link de pagamento, deve ser uma url
        válida. |


        **Copiar linha digitável de boleto:**


        | Propriedade | **Tipo** | **Obrigatório?** | Descrição |

        | --- | --- | --- | --- |

        | type | string | Sim | Deve ser "boleto" |

        | boleto | Boleto | Sim | Objeto que contém detalhes do boleto |


        Boleto:


        | **Propriedade** | **Tipo** | **Obrigatório** | **Descrição** |

        | --- | --- | --- | --- |

        | digitableLine | string | Sim | Linha digitável do boleto |


        O objeto Order está definido como:


        | **Propriedade** | **Tipo** | **Obrigatório?** | **Descrição** |

        | --- | --- | --- | --- |

        | status | string | Sim | Status do pedido. Atualmente o único valor
        suportado é "pending" |

        | tax | Tax | Sim | Objeto que representa se o pedido possui taxas (de
        entrega, por exemplo), contendo o valor da taxa e uma descrição |

        | items | Item\[\] | Sim | Lista de itens que compõem o pedido |

        | subtotal | decimal | Sim | Valor total dos itens do pedido
        DESCONSIDERANDO A TAXA. Levar em consideração apenas o somatório do
        valor de todos os itens contidos no pedido.. Exemplo: 20.99 |


        Tax:


        | **Propriedade** | **Tipo** | **Obrigatório?** | **Descrição** |

        | --- | --- | --- | --- |

        | value | decimal | Sim | Valor da taxa. Caso não haja taxa, deve ser
        informado 0 |

        | description | string | Não | Descrição da taxa, por exemplo: "Taxa de
        entrega" |


        Item:


        | **Propriedade** | **Tipo** | **Obrigatório?** | **Descrição** |

        | --- | --- | --- | --- |

        | retailerId | string | Sim | ID do produto/item do pedido |

        | name | string | Sim | Nome do produto/item do pedido |

        | amount | decimal | Sim | Valor do produto/item do pedido. Exemplo:
        20.99 |

        | quantity | int | Sim | Quantidade do produto/item em questão. Exemplo:
        1 |


        E o objeto responseAction está definido como:


        | **Propriedade** | **Tipo** | **Obrigatório?** | **Descrição** |

        | --- | --- | --- | --- |

        | type | int | Sim | Obrigatório. Tipo de comportamento. 0 para enviar
        para departamento e 1 para enviar para fluxo |

        | sendTo | string | Sim | Obrigatório. Id do departamento ou fluxo a ser
        enviado |
      tags:
        - APIs/Mensagens
      parameters:
        - name: body
          in: body
          schema:
            type: object
            properties:
              user:
                type: object
                properties:
                  name:
                    type: string
                  phone:
                    type: string
                  email:
                    type: 'null'
                  gender:
                    type: integer
                  channelId:
                    type: string
                  channelType:
                    type: integer
                  defaultDepartmentId:
                    type: 'null'
                required:
                  - name
                  - phone
                  - email
                  - gender
                  - channelId
                  - channelType
                  - defaultDepartmentId
              message:
                type: object
                properties:
                  templateId:
                    type: string
                  orderParameters:
                    type: object
                    properties:
                      referenceId:
                        type: string
                      paymentSettings:
                        type: array
                        items:
                          type: object
                          properties:
                            type:
                              type: string
                            pixDynamicCode:
                              type: object
                              properties:
                                code:
                                  type: string
                                merchantName:
                                  type: string
                                key:
                                  type: string
                                keyType:
                                  type: string
                              required:
                                - code
                                - merchantName
