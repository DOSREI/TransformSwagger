  /api/attendances:
    post:
      summary: Listar atendimentos
      deprecated: false
      description: >-
        Lista histórico de atendimentos do chatbot para fins de métricas,
        podendo opcionalmente também retornar os contatos que atualmente estão
        Esperando ou Em atendimento.


        O filtro consiste no seguinte objeto:


        | **Propriedade** | **Tipo** | **Obrigatório?** | **Descrição** |

        | --- | --- | --- | --- |

        | startDate | DateTime | Sim | Data para início da pesquisa no formato
        yyyy-MM-dd. Se forem enviadas informações de horário, erá
        desconsiderado, sempre buscando a partir de 00:00:00 |

        | endDate | DateTime | Sim | Data para término da pesquisa no formato
        yyyy-MM-dd. Se forem enviadas informações de horário, erá
        desconsiderado, sempre buscando até 23:59:59 |

        | channelId | string | Não | Id do canal para filtrar. Opcional, se
        null, são buscados atendimentos de todos os canais |

        | attendantId | string | Não | Id do atendente para filtrar. Opcional,
        se null, são buscados atendimentos de todos os atendentes |

        | getCurrent | bool | Não | Se devemos retornar também os contatos que
        ainda não tiveram atendimento finalizado, mas encontram-se nas filas
        Esperando ou Atendimento. Opcional, por padrão false. |

        | useBusinessHours | bool | Não | Ao calcular o tempo de espera,
        atendimento e tempo médio de resposta, se devemos considerar apenas
        horário comercial (ou seja, desconsiderar o tempo durante feriados ou
        fins de semana) ou horário corrido. Opcional, padrão false. |
      tags:
        - APIs/Atendimentos
      parameters:
        - name: Content-Type
          in: header
          description: ''
          required: true
          type: string
          x-example: application/json
        - name: Authorization
          in: header
          description: ''
          required: true
          type: string
          x-example: Bearer SEU_TOKEN
        - name: body
          in: body
          schema:
            type: object
            properties:
              startDate:
                type: string
              endDate:
                type: string
              channelId:
                type: 'null'
              attendantId:
                type: 'null'
              getCurrent:
                type: boolean
              useBusinessHours:
                type: boolean
            required:
              - startDate
              - endDate
              - channelId
              - attendantId
              - getCurrent
              - useBusinessHours
      responses:
        '200':
          description: ''
          headers: {}
          examples:
            application/json:
              success: true
              data:
                - status: 0
                  requestDate: '2025-05-09T17:33:03.9252436Z'
                  startDate: '2025-05-09T17:33:03.9252436Z'
