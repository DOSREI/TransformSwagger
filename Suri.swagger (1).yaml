  /api/contacts/user_id/messages:
    get:
      summary: Listar Mensagens do Contato
      deprecated: false
      description: >-
        Endpoint usado para recuperar mensagens de um contato definido por
        {{user\_id}}.


        | **Propriedade** | **Tipo** | **Descrição** |

        | --- | --- | --- |

        | success | bool | Se a requisição deu certo ou não |

