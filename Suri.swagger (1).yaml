  /api/shop/orders:
    post:
      summary: Listar Pedidos
      deprecated: false
      description: >-
        ## ShopOrderFilter


        | Campo | Tipo | Obrigatório | Descrição |

        | --- | --- | --- | --- |

        | CreateDate | DateTime? | Não | Data inicial do filtro. Se não for
        informada, assume 30 dias atrás. |

        | FinalizedDate | DateTime? | Não | Data final do filtro. Se não for
        informada, assume o momento atual. |

        | ProviderOrderId | string | Não | Identificador da ordem no provider. |

        | Status | ShopOrderStatus? | Não | Status do pedido.  <br>0: Criando 
        <br>1: Recebido  <br>2: Pago  <br>3: Cancelado  <br>4: Erro |

        | LogisticStatus | ShopLogisticStatus? | Não | Status logístico do
        pedido.  <br>0: Aguardando  <br>1: Em separação  <br>2: Separado  <br>3:
